<!-- @dsCard group="Colors" viewport="700x150" name="Brand · Iris & Cyan" subtitle="Primary iris ramp and cyan data accent" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 56px; border-radius: var(--r-md); border: 1px solid var(--border-subtle); }
  .nm { font-size: 11.5px; font-weight: var(--fw-medium); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--iris-deep)"></div><span class="nm">Iris Deep</span><span class="hex">#4A3CD0</span></div>
    <div class="sw"><div class="chip" style="background:var(--iris)"></div><span class="nm">Iris</span><span class="hex">#5C4DE6</span></div>
    <div class="sw"><div class="chip" style="background:var(--iris-soft)"></div><span class="nm">Iris Soft</span><span class="hex">#6D5EF6</span></div>
    <div class="sw"><div class="chip" style="background:var(--cyan)"></div><span class="nm">Cyan</span><span class="hex">#0E9C8B</span></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-soft)"></div><span class="nm">Cyan Soft</span><span class="hex">#0CB4A0</span></div>
    <div class="sw"><div class="chip" style="background:var(--brand-grad)"></div><span class="nm">Gradient</span><span class="hex">iris→cyan</span></div>
  </div>
</body>
</html>
