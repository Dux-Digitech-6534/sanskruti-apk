<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 30px 32px; display: flex; align-items: center; min-height: 120px; }
  .light { background: #F3F4F7; }
  .dark { background: #0A0D13; }
  .panel img { height: 46px; width: auto; }
</style></head>
<body>
  <div class="panel light"><img src="../assets/dux-logo.png" alt="DUX Digitech" /></div>
  <div class="panel dark"><img src="../assets/dux-logo-white.png" alt="DUX Digitech" /></div>
</body>
</html>
