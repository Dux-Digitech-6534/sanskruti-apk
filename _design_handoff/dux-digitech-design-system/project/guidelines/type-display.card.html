<!-- @dsCard group="Type" viewport="700x180" name="Display & headings" subtitle="Geist, tight tracking at large sizes" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 22px; }
  .row { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--border-subtle); padding: 9px 0; }
  .row:last-child { border-bottom: none; }
  .spec { width: 130px; flex: 0 0 auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
  .em em { font-style: normal; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style></head>
<body>
  <div class="row"><span class="spec">Display · 26 / 600</span><span class="em" style="font-size:26px;font-weight:600;letter-spacing:var(--ls-display)">Ask DUX about your <em>operations</em></span></div>
  <div class="row"><span class="spec">H1 · 22 / 600</span><span style="font-size:22px;font-weight:600;letter-spacing:var(--ls-tight)">Purchase orders this week</span></div>
  <div class="row"><span class="spec">H2 · 18 / 600</span><span style="font-size:18px;font-weight:600;letter-spacing:var(--ls-tight)">Supplier breakdown</span></div>
  <div class="row"><span class="spec">H3 · 16 / 600</span><span style="font-size:16px;font-weight:600">Bhandari Hardware</span></div>
</body>
</html>
