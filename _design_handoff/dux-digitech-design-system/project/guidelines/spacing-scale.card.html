<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="4px base — 4 / 8 / 12 / 16 / 24 / 32 / 48" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 24px 22px; display: flex; gap: 20px; align-items: flex-end; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .bar { background: var(--iris-tint); border: 1px solid var(--iris); border-radius: 4px; width: 22px; }
  .nm { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="sw"><div class="bar" style="height:var(--sp-1)"></div><span class="nm">1·4</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-2)"></div><span class="nm">2·8</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-3)"></div><span class="nm">3·12</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-4)"></div><span class="nm">4·16</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-6)"></div><span class="nm">6·24</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-8)"></div><span class="nm">8·32</span></div>
  <div class="sw"><div class="bar" style="height:var(--sp-12)"></div><span class="nm">12·48</span></div>
</body>
</html>
