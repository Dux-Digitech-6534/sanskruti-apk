<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); display: flex; }
  .panel { flex: 1; padding: 28px; display: flex; align-items: center; justify-content: center; gap: 26px; min-height: 124px; }
  .light { background: #F3F4F7; }
  .dark { background: #0A0D13; }
  .panel img { height: 40px; }
  .tile { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; }
  .tile.l { background: #F4F4FC; border: 1px solid #DCDFE6; }
  .tile.d { background: rgba(255,255,255,.04); border: 1px solid #2C3344; }
  .tile img { height: 30px; }
</style></head>
<body>
  <div class="panel light"><img src="../assets/dux-mark.png" alt="DX" /><div class="tile l"><img src="../assets/dux-mark.png" alt="DX" /></div></div>
  <div class="panel dark"><img src="../assets/dux-mark-white.png" alt="DX" /><div class="tile d"><img src="../assets/dux-mark-white.png" alt="DX" /></div></div>
</body>
</html>
