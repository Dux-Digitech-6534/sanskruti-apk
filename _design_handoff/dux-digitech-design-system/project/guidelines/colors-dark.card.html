<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme surfaces" subtitle="The instrument surface — canvas, cards, accents on near-black" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--canvas); color: var(--fg-1); padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 56px; border-radius: var(--r-md); border: 1px solid var(--hairline-2); }
  .nm { font-size: 11.5px; font-weight: var(--fw-medium); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--canvas)"></div><span class="nm">Canvas</span><span class="hex">#0A0D13</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><span class="nm">Surface 1</span><span class="hex">#11151E</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><span class="nm">Surface 3</span><span class="hex">#1E2433</span></div>
    <div class="sw"><div class="chip" style="background:var(--iris)"></div><span class="nm">Iris</span><span class="hex">#6D5EF6</span></div>
    <div class="sw"><div class="chip" style="background:var(--cyan)"></div><span class="nm">Cyan</span><span class="hex">#2DD4BF</span></div>
    <div class="sw"><div class="chip" style="background:var(--brand-grad)"></div><span class="nm">Gradient</span><span class="hex">iris→cyan</span></div>
  </div>
</body>
</html>
