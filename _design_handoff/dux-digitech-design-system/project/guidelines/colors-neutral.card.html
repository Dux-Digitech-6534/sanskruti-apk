<!-- @dsCard group="Colors" viewport="700x150" name="Neutral surfaces" subtitle="Canvas, surfaces, hairlines — light theme" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 56px; border-radius: var(--r-md); border: 1px solid var(--border-strong); }
  .nm { font-size: 11.5px; font-weight: var(--fw-medium); }
  .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--canvas)"></div><span class="nm">Canvas</span><span class="hex">#F3F4F7</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><span class="nm">Surface 1</span><span class="hex">#FFFFFF</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><span class="nm">Sunken</span><span class="hex">#F0F1F5</span></div>
    <div class="sw"><div class="chip" style="background:var(--hairline)"></div><span class="nm">Hairline</span><span class="hex">#E7E9EE</span></div>
    <div class="sw"><div class="chip" style="background:var(--hairline-2)"></div><span class="nm">Hairline 2</span><span class="hex">#DCDFE6</span></div>
  </div>
</body>
</html>
