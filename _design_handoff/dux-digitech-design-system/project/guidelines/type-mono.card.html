<!-- @dsCard group="Type" viewport="700x160" name="Mono numerics" subtitle="JetBrains Mono, tabular — IDs, amounts, dates, timestamps" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 22px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 8px 0; }
  .spec { width: 120px; flex: 0 0 auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="row"><span class="spec">ID · cyan</span><span class="mono" style="font-size:14px;font-weight:600;color:var(--cyan)">PUR-ORD-2026-00184</span></div>
  <div class="row"><span class="spec">Amount</span><span class="mono" style="font-size:16px;font-weight:500;color:var(--fg-1)">₹ 4,20,000</span></div>
  <div class="row"><span class="spec">Date</span><span class="mono" style="font-size:13px;color:var(--fg-2)">14 Mar 2026</span></div>
  <div class="row"><span class="spec">Timestamp</span><span class="mono" style="font-size:11px;color:var(--fg-4)">DUX · 09:42</span></div>
</body>
</html>
