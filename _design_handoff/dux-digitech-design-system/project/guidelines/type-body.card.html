<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 22px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; }
  .spec { width: 130px; flex: 0 0 auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
  .label { font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-muted); font-weight: var(--fw-semibold); }
</style></head>
<body>
  <div class="row"><span class="spec">Body · 14.5 / 1.6</span><span style="font-size:14.5px;line-height:1.6;color:var(--fg-1)">Type a plain-English question and DUX pulls the exact records from your ERP.</span></div>
  <div class="row"><span class="spec">Small · 13 / 500</span><span style="font-size:13px;font-weight:500;color:var(--fg-2)">12 Purchase Order records found</span></div>
  <div class="row"><span class="spec">Meta · 12.5</span><span style="font-size:12.5px;color:var(--fg-3)">Refine within these filters, or start a new search</span></div>
  <div class="row"><span class="spec">Label · 11 caps</span><span class="label">Showing results for</span></div>

</html>
