<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Card & pop shadows with inset highlight" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg-app); color: var(--text-primary); padding: 26px 22px; display: flex; gap: 26px; align-items: center; }
  .sw { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .box { width: 150px; height: 64px; background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style></head>
<body>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-card),var(--inset-hi)"></div><span class="nm">--shadow-card</span></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-pop),var(--inset-hi)"></div><span class="nm">--shadow-pop</span></div>
  <div class="sw"><div class="box" style="background:linear-gradient(150deg,var(--iris),var(--iris-deep));border:none;box-shadow:var(--shadow-brand)"></div><span class="nm">--shadow-brand</span></div>
</body>
</html>
